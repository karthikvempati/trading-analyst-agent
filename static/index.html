<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Analyst Agent</title>
<style>
  :root { --bg:#0f1420; --card:#182032; --ink:#e8edf6; --dim:#9aa6bd; --go:#2fbf71; --caution:#e0a83c; --nogo:#e05252; --line:#2a3550; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif; padding:14px; max-width:760px; margin-left:auto; margin-right:auto; }
  h1 { font-size:1.35rem; margin:0.4em 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:12px 0; }
  label { display:block; font-size:0.8rem; color:var(--dim); margin:10px 0 4px; }
  input[type=text], input[type=number], select { width:100%; padding:11px; font-size:1rem; border-radius:9px; border:1px solid var(--line); background:#0c1220; color:var(--ink); }
  .modes { display:flex; gap:8px; margin-top:6px; }
  .modes button { flex:1; padding:11px 4px; border-radius:9px; border:1px solid var(--line); background:#0c1220; color:var(--dim); font-size:0.9rem; }
  .modes button.on { background:#23406e; color:#fff; border-color:#3f6db3; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .go-btn { width:100%; margin-top:14px; padding:14px; font-size:1.05rem; font-weight:700; border-radius:10px; border:0; background:#2f6fd0; color:#fff; }
  .verdict { font-size:1.15rem; font-weight:800; padding:12px; border-radius:10px; text-align:center; margin:12px 0; }
  .GO { background:rgba(47,191,113,.16); color:var(--go); border:1px solid var(--go); }
  .CAUTION { background:rgba(224,168,60,.14); color:var(--caution); border:1px solid var(--caution); }
  .NO-GO { background:rgba(224,82,82,.14); color:var(--nogo); border:1px solid var(--nogo); }
  .sec h3 { margin:0 0 6px; font-size:0.95rem; color:#c9d4ea; }
  .sec p { margin:0; font-size:0.92rem; line-height:1.55; color:var(--ink); }
  .meta { font-size:0.75rem; color:var(--dim); margin-top:8px; }
  .err { background:rgba(224,82,82,.12); border:1px solid var(--nogo); color:#ffb3b3; padding:12px; border-radius:10px; }
  .spin { text-align:center; color:var(--dim); padding:24px; }
  ul { margin:6px 0; padding-left:20px; font-size:0.9rem; }
  li { margin:3px 0; }
  .foot { text-align:center; color:var(--dim); font-size:0.72rem; margin:22px 0; }
  .chart-wrap { position:relative; width:100%; height:430px; margin-top:10px; }
  .chart-wrap canvas { width:100%; height:100%; display:block; }
  .chart-toolbar { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .chart-toolbar select { width:auto; padding:7px 9px; font-size:.85rem; }
  .chart-tools { display:flex; gap:4px; align-items:center; }
  .chart-tools button { width:30px; height:30px; padding:0; border:1px solid var(--line); border-radius:6px; background:#0c1220; color:var(--ink); font-size:1.1rem; }
  .legend { color:var(--dim); font-size:.76rem; }
  .candle-detail { margin-top:10px; padding:10px; border:1px solid var(--line); border-radius:8px; background:#0c1220; color:var(--dim); font-size:.82rem; line-height:1.5; }
  .candle-detail strong { color:var(--ink); }
  .candle-tooltip { position:absolute; z-index:3; display:none; max-width:255px; padding:9px 10px; border:1px solid #4b6590; border-radius:7px; background:rgba(12,18,32,.96); box-shadow:0 8px 20px rgba(0,0,0,.28); color:var(--dim); font-size:.76rem; line-height:1.45; pointer-events:none; }
  .candle-tooltip strong { color:var(--ink); }
  #priceChart { cursor:crosshair; }
  .ask-row { display:flex; gap:8px; margin-top:8px; }
  .ask-row input { flex:1; min-width:0; }
  .ask-row button { padding:0 16px; border:0; border-radius:9px; background:#2f6fd0; color:#fff; font-weight:700; }
  .ask-answer { margin-top:10px; padding:10px; border-left:3px solid #6da8ff; background:#0c1220; color:var(--ink); line-height:1.5; }
  .ask-panel { margin-top:10px; border:1px solid var(--line); border-radius:8px; background:#101827; }
  .ask-panel summary { cursor:pointer; padding:9px 10px; color:#c9d4ea; font-size:.9rem; font-weight:700; }
  .ask-panel[open] summary { border-bottom:1px solid var(--line); }
  .ask-panel-content { padding:0 10px 10px; }
</style>
</head>
<body>
<h1>📈 Trading Analyst Agent</h1>
<div class="card">
  <label for="ticker">Ticker</label>
  <input id="ticker" type="text" value="SPY" autocapitalize="characters" spellcheck="false">
  <label>Mode</label>
  <div class="modes">
    <button data-mode="stock" class="on">Analyze stock</button>
    <button data-mode="entry">Evaluate entry</button>
    <button data-mode="csp">Cash-secured put</button>
  </div>
  <div id="cspfields" style="display:none">
    <div class="grid2">
      <div><label for="strike">Strike ($)</label><input id="strike" type="number" step="0.5" placeholder="e.g. 240"></div>
      <div><label for="credit">Credit received / share ($)</label><input id="credit" type="number" step="0.05" placeholder="e.g. 3.10"></div>
    </div>
    <div class="grid3">
      <div><label for="delta">Delta</label><input id="delta" type="number" step="0.01" placeholder="0.22"></div>
      <div><label for="iv">IV (0–2)</label><input id="iv" type="number" step="0.01" placeholder="0.45"></div>
      <div><label for="dte">DTE</label><input id="dte" type="number" value="34"></div>
    </div>
    <div><label for="contracts">Contracts</label><input id="contracts" type="number" value="1" min="1"></div>
    <p class="meta">CSP math uses only the terms you type — no options chain is ever invented.</p>
  </div>
  <button class="go-btn" id="go">Run analysis</button>
</div>
<div id="out"></div>
<div class="foot">Self-hosted build · data: yfinance free feed · missing data renders as “unavailable”, never guessed.</div>

<script>
let mode = "stock", runSequence = 0;
document.querySelectorAll(".modes button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".modes button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); mode = b.dataset.mode;
  document.getElementById("cspfields").style.display = mode === "csp" ? "block" : "none";
});

function sec(title, body, meta) {
  return `<div class="card sec"><h3>${title}</h3><p>${body}</p>${meta ? `<div class="meta">${meta}</div>` : ""}</div>`;
}
function list(title, items) {
  if (!items || !items.length) return "";
  return `<div class="card sec"><h3>${title}</h3><ul>${items.map(i => `<li>${i}</li>`).join("")}</ul></div>`;
}
function esc(s){ return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

let activeChartData = null, chartStart = 0, chartEnd = 0, chartDragX = null;

function drawChart(data) {
  const canvas = document.getElementById("priceChart"), box = canvas.parentElement;
  const ratio = window.devicePixelRatio || 1, width = box.clientWidth, height = box.clientHeight;
  canvas.width = width * ratio; canvas.height = height * ratio;
  const ctx = canvas.getContext("2d"); ctx.scale(ratio, ratio);
  activeChartData = data;
  if (!chartEnd || chartEnd > data.candles.length) { chartStart = 0; chartEnd = data.candles.length; }
  const candles = data.candles.slice(chartStart, chartEnd), pad = {left:44, right:8, top:12, bottom:28};
  const chartW = width - pad.left - pad.right, priceH = height * .58 - pad.top;
  const flowTop = pad.top + priceH + 28, flowH = height - flowTop - pad.bottom;
  const prices = candles.flatMap(c => [c.highs, c.lows]);
  const levelValues = Object.values(data.levels || {}).filter(value => typeof value === "number");
  const max = Math.max(...prices, ...levelValues), min = Math.min(...prices, ...levelValues), range = max - min || 1;
  const x = i => pad.left + (i / Math.max(1, candles.length - 1)) * chartW;
  const y = value => pad.top + (max - value) / range * priceH;
  ctx.clearRect(0, 0, width, height); ctx.font = "11px sans-serif";
  ctx.strokeStyle = "#2a3550"; ctx.fillStyle = "#9aa6bd"; ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const gy = pad.top + i * priceH / 3; ctx.beginPath(); ctx.moveTo(pad.left, gy); ctx.lineTo(width - pad.right, gy); ctx.stroke();
    ctx.fillText((max - i * range / 3).toFixed(2), 3, gy + 4);
  }
  const step = chartW / Math.max(1, candles.length - 1), candleW = Math.max(2, Math.min(9, step * .62));
  candles.forEach((c, i) => {
    const rising = c.closes >= c.opens, color = rising ? "#2fbf71" : "#e05252", cx = x(i);
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(cx, y(c.highs)); ctx.lineTo(cx, y(c.lows)); ctx.stroke();
    const top = y(Math.max(c.opens, c.closes)), bottom = y(Math.min(c.opens, c.closes));
    ctx.fillRect(cx - candleW / 2, top, candleW, Math.max(1, bottom - top));
  });
  function line(values, color) { ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath(); let started = false;
    values.forEach((value, i) => { if (value == null) return; if (!started) { ctx.moveTo(x(i), y(value)); started = true; } else ctx.lineTo(x(i), y(value)); }); ctx.stroke(); }
  line(data.ema20, "#e0a83c"); line(data.ema50, "#6da8ff");
  const levels = [
    ["BUY ENTRY", data.levels?.buy_entry ?? data.levels?.best_entry, "#55d6be"],
    ["SELL ENTRY", data.levels?.sell_entry ?? data.levels?.entry_trigger, "#e05252"],
    ["Secondary support", data.levels?.secondary_support, "#2fbf71"],
    ["Secondary resistance", data.levels?.secondary_resistance, "#e05252"],
  ];
  levels.forEach(([label, value, color]) => {
    if (typeof value !== "number") return;
    const levelY = y(value); ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(pad.left, levelY); ctx.lineTo(width - pad.right, levelY); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = color; ctx.fillText(`${label} $${value.toFixed(2)}`, Math.max(pad.left, width - 150), levelY - 3);
  });
  ctx.strokeStyle = "#2a3550"; ctx.beginPath(); ctx.moveTo(pad.left, flowTop); ctx.lineTo(width - pad.right, flowTop); ctx.stroke();
  const maxVolume = Math.max(...candles.map(c => c.volumes || 0), 1);
  candles.forEach((c, i) => { const barH = (c.volumes || 0) / maxVolume * flowH * .35; ctx.fillStyle = "rgba(154,166,189,.22)"; ctx.fillRect(x(i) - candleW / 2, flowTop + flowH - barH, candleW, barH); });
  const ad = data.ad_line.slice(chartStart, chartEnd), adMin = Math.min(...ad), adMax = Math.max(...ad), adRange = adMax - adMin || 1;
  const cmf = data.cmf20.slice(chartStart, chartEnd);
  function flowY(value, low, high) { return flowTop + (high - value) / (high - low || 1) * flowH; }
  ctx.strokeStyle = "#55d6be"; ctx.lineWidth = 1.5; ctx.beginPath();
  ad.forEach((value, i) => { const pointY = flowY(value, adMin, adMax); if (!i) ctx.moveTo(x(i), pointY); else ctx.lineTo(x(i), pointY); }); ctx.stroke();
  ctx.strokeStyle = "#e0a83c"; ctx.beginPath(); let cmfStarted = false;
  cmf.forEach((value, i) => { if (value == null) return; const pointY = flowY(value, -1, 1); if (!cmfStarted) { ctx.moveTo(x(i), pointY); cmfStarted = true; } else ctx.lineTo(x(i), pointY); }); ctx.stroke();
  ctx.strokeStyle = "rgba(224,168,60,.45)"; ctx.beginPath(); ctx.moveTo(pad.left, flowY(0, -1, 1)); ctx.lineTo(width - pad.right, flowY(0, -1, 1)); ctx.stroke();
  ctx.fillStyle = "#9aa6bd"; ctx.fillText("A/D", pad.left, flowTop + 12); ctx.fillText("CMF", pad.left + 30, flowTop + 12);
  ctx.fillText(candles[0].dates, pad.left, height - 8); ctx.fillText(candles[candles.length - 1].dates, width - 76, height - 8);
  const tooltip = document.getElementById("candleTooltip");
  const tooltipHtml = candle => {
    const index = data.candles.indexOf(candle), previous = data.candles[index - 1];
    const change = previous ? (candle.closes - previous.closes) / previous.closes * 100 : null;
    const fmt = value => value == null ? "n/a" : Number(value).toLocaleString(undefined, {maximumFractionDigits: 2});
    return `<strong>${esc(candle.dates)}</strong> · ${candle.closes >= candle.opens ? "up" : "down"}${change == null ? "" : ` ${change >= 0 ? "+" : ""}${change.toFixed(2)}%`}<br>Phase <strong>${esc(data.phases?.[index] || "n/a")}</strong><br>O <strong>$${fmt(candle.opens)}</strong> · H <strong>$${fmt(candle.highs)}</strong> · L <strong>$${fmt(candle.lows)}</strong> · C <strong>$${fmt(candle.closes)}</strong><br>Range <strong>$${fmt(candle.highs - candle.lows)}</strong> · Vol <strong>${fmt(candle.volumes)}</strong><br>EMA20 <strong>${fmt(data.ema20[index])}</strong> · EMA50 <strong>${fmt(data.ema50[index])}</strong><br>A/D <strong>${fmt(data.ad_line[index])}</strong> · CMF20 <strong>${fmt(data.cmf20[index])}</strong>`;
  };
  const showTooltip = e => {
    if (!tooltip) return;
    const rect = canvas.getBoundingClientRect(), point = Math.max(0, Math.min(candles.length - 1, Math.round((e.clientX - rect.left - pad.left) / chartW * Math.max(1, candles.length - 1))));
    tooltip.innerHTML = tooltipHtml(candles[point]); tooltip.style.display = "block";
    const wrap = canvas.parentElement, wrapRect = wrap.getBoundingClientRect();
    tooltip.style.left = `${Math.min(wrap.clientWidth - tooltip.offsetWidth - 6, Math.max(6, e.clientX - wrapRect.left + 12))}px`;
    tooltip.style.top = `${-tooltip.offsetHeight - 6}px`;
  };
  canvas.onclick = e => { if (chartDragX == null) showTooltip(e); };
  canvas.onwheel = e => { e.preventDefault(); const span = chartEnd - chartStart; const next = Math.max(30, Math.min(data.candles.length, Math.round(span * (e.deltaY < 0 ? .8 : 1.25)))); const center = chartStart + span / 2; chartStart = Math.max(0, Math.min(data.candles.length - next, Math.round(center - next / 2))); chartEnd = chartStart + next; drawChart(data); };
  canvas.onpointerdown = e => { chartDragX = e.clientX; canvas.setPointerCapture(e.pointerId); };
  canvas.onpointermove = e => { if (chartDragX == null) return; const shift = Math.round((chartDragX - e.clientX) / Math.max(1, chartW) * (chartEnd - chartStart)); if (Math.abs(shift) > 0) { const span = chartEnd - chartStart; chartStart = Math.max(0, Math.min(data.candles.length - span, chartStart + shift)); chartEnd = chartStart + span; chartDragX = e.clientX; drawChart(data); } };
  canvas.onpointerup = () => { chartDragX = null; };
}

async function chartCard(ticker, selectedPeriod = "3mo", selectedInterval = "4h") {
  const period = selectedPeriod || "3mo";
  const interval = selectedInterval || "4h";
  const r = await fetch(`/api/chart?ticker=${encodeURIComponent(ticker)}&period=${period}&interval=${interval}`), d = await r.json();
  if (!r.ok) throw new Error(d.detail || "Chart data unavailable.");
  const levels = d.levels || {};
  const levelText = `BUY ENTRY $${Number(levels.buy_entry ?? levels.best_entry).toFixed(2)} · SELL ENTRY $${Number(levels.sell_entry ?? levels.entry_trigger).toFixed(2)} · secondary support $${Number(levels.secondary_support).toFixed(2)} · secondary resistance $${Number(levels.secondary_resistance).toFixed(2)}`;
  return `<div class="card sec">
    <div class="chart-toolbar"><h3>${esc(ticker)} candlestick chart</h3><div class="chart-tools">
      <button id="zoomOut" title="Zoom out">−</button><button id="zoomIn" title="Zoom in">+</button><button id="zoomReset" title="Reset zoom">↺</button>
      <select id="chartInterval"><option value="1m" ${interval === "1m" ? "selected" : ""}>1 minute</option><option value="5m" ${interval === "5m" ? "selected" : ""}>5 minutes</option><option value="15m" ${interval === "15m" ? "selected" : ""}>15 minutes</option><option value="30m" ${interval === "30m" ? "selected" : ""}>30 minutes</option><option value="1h" ${interval === "1h" ? "selected" : ""}>1 hour</option><option value="4h" ${interval === "4h" ? "selected" : ""}>4 hours</option><option value="1d" ${interval === "1d" ? "selected" : ""}>1 day</option></select>
      <select id="chartPeriod"><option value="1d" ${period === "1d" ? "selected" : ""}>1 day</option><option value="5d" ${period === "5d" ? "selected" : ""}>5 days</option><option value="10d" ${period === "10d" ? "selected" : ""}>10 days</option><option value="1mo" ${period === "1mo" ? "selected" : ""}>1 month</option><option value="3mo" ${period === "3mo" ? "selected" : ""}>3 months</option><option value="6mo" ${period === "6mo" ? "selected" : ""}>6 months</option><option value="9mo" ${period === "9mo" ? "selected" : ""}>9 months</option><option value="1y" ${period === "1y" ? "selected" : ""}>1 year</option><option value="2y" ${period === "2y" ? "selected" : ""}>2 years</option></select>
    </div></div>
    ${askCard(ticker)}
    <div class="legend"><span style="color:#e0a83c">EMA20</span> · <span style="color:#6da8ff">EMA50</span> · <span style="color:#55d6be">A/D line</span> · <span style="color:#e0a83c">CMF20</span> · RSI ${d.rsi == null ? "n/a" : d.rsi.toFixed(0)}</div>
    <div class="chart-wrap"><canvas id="priceChart"></canvas><div id="candleTooltip" class="candle-tooltip" role="status"></div></div>
    <div class="meta">${esc(levelText)} · ${esc(d.interval)} candles over ${esc(d.period)} · Click a candle for details · Scroll to zoom; drag to pan. · ${esc(d.insight)} · ${esc(d.as_of)}</div>
  </div>`;
}

function askCard(ticker) {
  return `<details class="ask-panel"><summary>Ask about this chart</summary><div class="ask-panel-content"><div class="ask-row"><input id="chartQuestion" type="text" placeholder="e.g. What phase is the latest candle?" autocomplete="off"><button id="askButton">Ask</button></div><div id="askAnswer" class="ask-answer" role="status">Ask about phase, entry, support, resistance, RSI, trend, CMF, or the latest candle.</div></div></details>`;
}

async function askQuestion(ticker) {
  const input = document.getElementById("chartQuestion"), answer = document.getElementById("askAnswer");
  const question = input?.value.trim();
  if (!question) { answer.textContent = "Type a question about the chart first."; return; }
  answer.textContent = "Reading the current chart data…";
  try {
    const r = await fetch("/api/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ticker, question, period:document.getElementById("chartPeriod")?.value || "3mo", interval:document.getElementById("chartInterval")?.value || "4h"})});
    const d = await r.json();
    answer.textContent = r.ok ? d.answer : (d.detail || "Could not answer that question.");
  } catch (e) { answer.textContent = `Network error: ${e.message}`; }
}

async function run() {
  const requestId = ++runSequence;
  const out = document.getElementById("out");
  const ticker = document.getElementById("ticker").value.trim().toUpperCase();
  const chartPeriod = document.getElementById("chartPeriod")?.value || "3mo";
  const chartInterval = document.getElementById("chartInterval")?.value || "4h";
  if (!ticker) { out.innerHTML = `<div class="err">Enter a ticker first.</div>`; return; }
  const p = new URLSearchParams({ ticker, mode });
  if (mode === "csp") {
    const strike = document.getElementById("strike").value, credit = document.getElementById("credit").value;
    if (!strike || !credit) { out.innerHTML = `<div class="err">CSP mode needs at least a strike and a credit.</div>`; return; }
    p.set("strike", strike); p.set("credit", credit);
    ["delta","iv","dte","contracts"].forEach(k => { const v = document.getElementById(k).value; if (v) p.set(k, v); });
  }
  out.innerHTML = `<div class="spin">Analyzing ${esc(ticker)}… pulling live data.</div>`;
  try {
    const r = await fetch("/api/analyze?" + p.toString());
    const d = await r.json();
    if (requestId !== runSequence) return;
    if (!r.ok) { out.innerHTML = `<div class="err">${esc(d.detail || "Analysis failed.")}</div>`; return; }
    const m = d.mode_evaluation || {}, rk = d.risk || {}, cspm = (m.metrics || {});
    let html = `<div class="verdict ${d.verdict}">${esc(d.verdict_headline)}</div>`;
    try { html += await chartCard(ticker, chartPeriod, chartInterval); } catch (e) { html += `<div class="err">Chart unavailable: ${esc(e.message)}</div>`; }
    if (d.company) html += `<div class="meta" style="text-align:center">${esc(d.company)}${d.sector ? " · " + esc(d.sector) : ""} · analyzed ${esc(d.as_of)}</div>`;
    html += sec("Market regime gate", esc(d.regime.summary));
    html += sec("Technicals", esc(d.technicals.summary), "as of " + esc(d.technicals.as_of));
    html += sec("Valuation", esc(d.valuation.summary));
    html += sec("Catalysts", esc(d.catalysts.summary));
    html += sec(mode === "stock" ? "Stock read" : mode === "entry" ? "Entry evaluation" : "CSP evaluation", esc(m.summary));
    if (mode === "csp" && cspm.spot) {
      html += list("CSP contract math", [
        `Breakeven $${cspm.breakeven} — ${cspm.downside_buffer_pct}% below spot`,
        `Capital at risk $${Number(cspm.capital_at_risk).toLocaleString()} · premium $${Number(cspm.premium_total).toLocaleString()}`,
        `Max return ${cspm.return_on_risk_pct}%${cspm.annualized_pct ? ` (${cspm.annualized_pct}% annualized)` : ""}`,
      ]);
    }
    html += list("Risk manager — fired checks", [...(rk.blockers||[]).map(b=>"⛔ "+b), ...(rk.warnings||[]).map(w=>"⚠️ "+w)]);
    html += sec("Risk manager verdict", esc(rk.summary));
    html += `<div class="foot">${esc(d.data_note)}</div>`;
    out.innerHTML = html;
    document.getElementById("chartPeriod")?.addEventListener("change", () => { chartStart = 0; chartEnd = 0; run(); });
    document.getElementById("chartInterval")?.addEventListener("change", () => { chartStart = 0; chartEnd = 0; run(); });
    document.getElementById("askButton")?.addEventListener("click", () => askQuestion(ticker));
    document.getElementById("chartQuestion")?.addEventListener("keydown", e => { if (e.key === "Enter") askQuestion(ticker); });
    const chart = await fetch(`/api/chart?ticker=${encodeURIComponent(ticker)}&period=${chartPeriod}&interval=${chartInterval}`).then(x => x.json());
    if (requestId !== runSequence) return;
    if (chart.candles) {
      drawChart(chart);
      document.getElementById("zoomIn")?.addEventListener("click", () => {
        const span = chartEnd - chartStart, next = Math.max(30, Math.round(span * .8)), center = chartStart + span / 2;
        chartStart = Math.max(0, Math.min(chart.candles.length - next, Math.round(center - next / 2))); chartEnd = chartStart + next; drawChart(chart);
      });
      document.getElementById("zoomOut")?.addEventListener("click", () => {
        const span = chartEnd - chartStart, next = Math.min(chart.candles.length, Math.round(span * 1.25)), center = chartStart + span / 2;
        chartStart = Math.max(0, Math.min(chart.candles.length - next, Math.round(center - next / 2))); chartEnd = chartStart + next; drawChart(chart);
      });
      document.getElementById("zoomReset")?.addEventListener("click", () => { chartStart = 0; chartEnd = chart.candles.length; drawChart(chart); });
    }
    window.scrollTo({top:0, behavior:"smooth"});
  } catch (e) {
    out.innerHTML = `<div class="err">Network error: ${esc(e.message)}</div>`;
  }
}
document.getElementById("go").onclick = run;
document.getElementById("ticker").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
</script>
</body>
</html>
