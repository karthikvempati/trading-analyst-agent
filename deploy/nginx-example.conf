# nginx + Certbot alternative (if you prefer nginx over Caddy).
# Assumes the app runs on this host at 127.0.0.1:8000 (docker compose or systemd).
# 1) sudo apt install -y nginx certbot python3-certbot-nginx
# 2) Replace trading.example.com with your domain in the file below.
# 3) sudo cp nginx-example.conf /etc/nginx/sites-available/trading-analyst
#    sudo ln -s /etc/nginx/sites-available/trading-analyst /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 4) sudo certbot --nginx -d trading.example.com   # auto HTTPS + renewal

server {
    listen 80;
    server_name trading.example.com;

    # Optional basic auth (uncomment to require a login).
    # Create the file once: sudo htpasswd -c /etc/nginx/.htpasswd trader
    # auth_basic "Trading Analyst";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
